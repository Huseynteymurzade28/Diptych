# Built-in Diptych theme. Copy to ~/.config/diptych/themes/<name>.toml to make your own.
name = "Deep Dark"
dark = true

[colors]
window = "#0a0a0f"
sidebar = "#111118"
surface = "#1a1a24"
hover = "#252530"
text = "#e8e8ef"
text-secondary = "#8888a0"
text-muted = "#555566"
text-subtle = "#ccccdd"
accent = "#7c6ff0"
accent-hover = "#9d93f5"
accent-text = "@window"
border = "rgba(232, 232, 239, 0.06)"
border-hover = "rgba(124, 111, 240, 0.30)"
shadow = "rgba(0, 0, 0, 0.40)"
shadow-hover = "rgba(0, 0, 0, 0.55)"
danger = "#ff6b8b"

[files]
folder = "@accent"
rust = "#ffa657"
python = "#79c0ff"
js = "#ffd866"
c = "#56d4dd"
java = "#ff6b8b"
go = "#7ee787"
script = "#d2a8ff"
image = "#7ee787"
audio = "#d2a8ff"
video = "#ff6b8b"
archive = "#ffd866"
pdf = "#ff6b8b"
web = "#56d4dd"
text = "@text-muted"
config = "#56d4dd"
default = "@text-secondary"

[shape]
radius = 14
density = "comfortable"

[fonts]
ui = "Inter, Cantarell, sans-serif"
mono = "JetBrains Mono, monospace"
scale = 1.0
