# Built-in Diptych theme. Copy to ~/.config/diptych/themes/<name>.toml to make your own.
name = "Nord"
dark = true

[colors]
window = "#2e3440"
sidebar = "#242933"
surface = "#3b4252"
hover = "#434c5e"
text = "#d8dee9"
text-secondary = "#4c566a"
text-muted = "#4c566a"
text-subtle = "#d8dee9"
accent = "#88c0d0"
accent-hover = "#a3d1de"
accent-text = "@window"
border = "rgba(216, 222, 233, 0.06)"
border-hover = "rgba(136, 192, 208, 0.25)"
shadow = "rgba(0, 0, 0, 0.18)"
shadow-hover = "rgba(0, 0, 0, 0.28)"
danger = "#bf616a"

[files]
folder = "@accent"
rust = "#d08770"
python = "#ebcb8b"
js = "#ebcb8b"
c = "#81a1c1"
java = "#bf616a"
go = "#a3be8c"
script = "#b48ead"
image = "#a3be8c"
audio = "#b48ead"
video = "#bf616a"
archive = "#d08770"
pdf = "#bf616a"
web = "#88c0d0"
text = "@text-muted"
config = "#8fbcbb"
default = "@text-secondary"

[shape]
radius = 14
density = "comfortable"

[fonts]
ui = "system"        # desktop font (gtk-font-name); or e.g. "Inter, sans-serif"
mono = "JetBrains Mono, monospace"
scale = 1.0
