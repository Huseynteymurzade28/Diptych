# Built-in Diptych theme. Copy to ~/.config/diptych/themes/<name>.toml to make your own.
name = "Cozy Latte"
dark = false

[colors]
window = "#eff1f5"
sidebar = "#e6e9ef"
surface = "#dce0e8"
hover = "#ccd0da"
text = "#4c4f69"
text-secondary = "#6c6f85"
text-muted = "#8c8fa1"
text-subtle = "#5c5f77"
accent = "#dc8a78"
accent-hover = "#e6a192"
accent-text = "@window"
border = "rgba(76, 79, 105, 0.10)"
border-hover = "rgba(220, 138, 120, 0.30)"
shadow = "rgba(0, 0, 0, 0.06)"
shadow-hover = "rgba(0, 0, 0, 0.12)"
danger = "#d20f39"

[files]
folder = "@accent"
rust = "#fe640b"
python = "#1e66f5"
js = "#df8e1d"
c = "#179299"
java = "#d20f39"
go = "#40a02b"
script = "#8839ef"
image = "#40a02b"
audio = "#8839ef"
video = "#d20f39"
archive = "#df8e1d"
pdf = "#e64553"
web = "#179299"
text = "@text-muted"
config = "#179299"
default = "@text-secondary"

[shape]
radius = 14
density = "comfortable"

[fonts]
ui = "system"        # desktop font (gtk-font-name); or e.g. "Inter, sans-serif"
mono = "JetBrains Mono, monospace"
scale = 1.0
